# based on https://docs.netlify.com/configure-builds/file-based-configuration/#sample-file
[build]
  # Default build command.
  command = "gatsby build"
  # Directory (relative to root of your repo) that contains the deploy-ready
  # HTML files and assets generated by the build.
  publish = "public/"

[build.environment]
  NODE_VERSION = "22"

# The site is also still reachable at its default Netlify subdomain, with
# nothing yet sending it on to the real domain — a host-exact redirect, so
# it only matches that one host and leaves deploy previews (a different
# subdomain) alone.
[[redirects]]
  from = "https://is-webportal.netlify.app/*"
  to = "https://www.intentionalsociety.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/who-we-are"
  to = "/about"

[[redirects]]
  from = "/what-we-do"
  to = "/about"

[[redirects]]
  from = "/questions"
  to = "/resources#faq"

[[redirects]]
  from = "/history"
  to = "/community"

[[redirects]]
  from = "/get-involved"
  to = "/connect"
